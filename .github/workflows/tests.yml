name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}${{ matrix.dependencies == 'lowest' && ', lowest dependencies' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', laravel: '8', testbench: '^6.10' }
          - { php: '7.4', laravel: '8', testbench: '^6.10', dependencies: lowest }
          - { php: '8.0', laravel: '8', testbench: '^6.10' }
          - { php: '8.0', laravel: '9', testbench: '^7.0' }
          - { php: '8.1', laravel: '8', testbench: '^6.10' }
          - { php: '8.1', laravel: '9', testbench: '^7.0' }
          - { php: '8.1', laravel: '10', testbench: '^8.0' }
          - { php: '8.2', laravel: '9', testbench: '^7.0' }
          - { php: '8.2', laravel: '10', testbench: '^8.0' }
          - { php: '8.2', laravel: '11', testbench: '^9.0', dependencies: lowest }
          - { php: '8.2', laravel: '11', testbench: '^9.0' }
          - { php: '8.2', laravel: '12', testbench: '^10.0' }
          - { php: '8.3', laravel: '10', testbench: '^8.0' }
          - { php: '8.3', laravel: '11', testbench: '^9.0' }
          - { php: '8.3', laravel: '12', testbench: '^10.0' }
          - { php: '8.3', laravel: '13', testbench: '^11.0' }
          - { php: '8.3', laravel: '13', testbench: '^11.0', dependencies: lowest }
          - { php: '8.4', laravel: '11', testbench: '^9.0' }
          - { php: '8.4', laravel: '12', testbench: '^10.0' }
          - { php: '8.4', laravel: '13', testbench: '^11.0' }
          - { php: '8.5', laravel: '12', testbench: '^10.0' }
          - { php: '8.5', laravel: '13', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Old Laravel versions have known vulnerabilities; the package still supports them, so Composer must install them.
      - run: composer config audit.block-insecure false
      - run: composer require --dev --no-update --no-interaction orchestra/testbench:"${{ matrix.testbench }}"
      - run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      - run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress
